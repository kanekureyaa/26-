        body {

            text-align: center;
            margin-top: 80px;
        }

        button {
            display: block;
            width: 250px;
            padding: 15px;
            margin: 20px auto;
            font-size: 18px;
            cursor: pointer;
        }

            margin-top: 50px;
        }

</head>

<body>

    <p>日程を選択してください。</p>

    </button>

    <button onclick="location.href='day.html?day=2'">
        2日目
    </button>

    <button onclick="location.href='day.html?day=3'">

    </button>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
